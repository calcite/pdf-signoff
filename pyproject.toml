[project]
name = "pdf-signoff"
version = "0.1.0"
description = "Tool for signing and filling PDF forms, with support for agentic workflows."
authors = [
    { name = "Josef Nevrly", email = "josef.nevrly@gmail.com" }
]
license = { text = "MIT license" }
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    
    
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7,<9.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "onacol>=0.3.5,<0.4.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyhanko>=0.31.0,<1.0.0",
    "pymupdf>=1.26.0,<2.0.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/JNevrly/pdf_signoff"
Repository = "https://github.com/JNevrly/pdf_signoff"


[project.scripts]
pdf-signoff = "pdf_signoff.cli:main"


[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "tox>=4.34.0,<5.0.0",
    "coverage[toml]>=7.4,<8.0.0",
    "ruff>=0.14.0,<0.15.0",

    "pytest>=9.0,<10.0.0",
    "pytest-cov>=4.1,<5.0.0",

    "mypy>=1.19,<2.0.0",
]

[tool.coverage.run]
omit = [".*", "*/site-packages/*"]
source = ["pdf_signoff"]
relative_files = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_signoff"]
